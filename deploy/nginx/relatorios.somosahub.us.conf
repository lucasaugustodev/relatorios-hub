server {
    listen 80;
    server_name relatorios.somosahub.us;

    root /var/www/relatorios-hub/current;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.md$ {
        default_type text/markdown;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(css|js|json|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
