<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatorios — Hub Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="marked.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border-bottom: 1px solid #1e293b;
      padding: 24px 0;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(12px);
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .logo h1 {
      font-size: 20px;
      font-weight: 700;
      color: #f1f5f9;
    }
    .logo span {
      font-size: 13px;
      color: #64748b;
      font-weight: 400;
    }
    .header-meta {
      font-size: 13px;
      color: #64748b;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }
    .stat-card:hover { border-color: #6366f1; transform: translateY(-1px); }
    .stat-card.active { border-color: #6366f1; background: #1e2d4a; box-shadow: 0 0 16px rgba(99,102,241,0.2); }
    .stat-card .label {
      font-size: 12px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .stat-card .value {
      font-size: 28px;
      font-weight: 700;
      color: #f1f5f9;
    }
    .stat-card .value.green { color: #4ade80; }
    .stat-card .value.yellow { color: #fbbf24; }
    .stat-card .value.red { color: #f87171; }
    .stat-card .value.blue { color: #60a5fa; }
    .stat-card .value.purple { color: #a78bfa; }
    .filter-active-bar {
      display: none;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding: 10px 16px;
      background: #1e2d4a;
      border: 1px solid #6366f1;
      border-radius: 10px;
      font-size: 13px;
      color: #a5b4fc;
    }
    .filter-active-bar.show { display: flex; }
    .filter-active-bar button {
      background: #334155;
      border: none;
      color: #94a3b8;
      padding: 4px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      margin-left: auto;
    }
    .filter-active-bar button:hover { background: #475569; color: #f1f5f9; }
    .section-title {
      font-size: 16px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid #1e293b;
    }
    .reports-grid {
      display: grid;
      gap: 12px;
      margin-bottom: 40px;
    }
    .report-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      transition: all 0.2s;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }
    .report-card:hover {
      border-color: #6366f1;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.15);
    }
    .report-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .report-icon.bug { background: #fee2e2; }
    .report-icon.fix { background: #d1fae5; }
    .report-icon.plan { background: #dbeafe; }
    .report-icon.doc { background: #e0e7ff; }
    .report-icon.finance { background: #fef3c7; }
    .report-icon.analysis { background: #fce7f3; }
    .report-body {
      flex: 1;
      min-width: 0;
    }
    .report-body h3 {
      font-size: 15px;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 4px;
    }
    .report-body p {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
    }
    .report-meta {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .badge.critical { background: #991b1b; color: #fca5a5; }
    .badge.confirmed { background: #065f46; color: #6ee7b7; }
    .badge.pending { background: #78350f; color: #fcd34d; }
    .badge.info { background: #1e3a5f; color: #93c5fd; }
    .badge.done { background: #064e3b; color: #6ee7b7; }
    .badge.analysis { background: #4a1d6e; color: #d8b4fe; }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.active { display: flex; align-items: start; justify-content: center; padding: 40px 24px; }
    .modal {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      width: 100%;
      max-width: 900px;
      max-height: calc(100vh - 80px);
      overflow-y: auto;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }
    .modal-header {
      position: sticky;
      top: 0;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      border-radius: 16px 16px 0 0;
    }
    .modal-header h2 {
      font-size: 16px;
      font-weight: 600;
    }
    .modal-close {
      background: #334155;
      border: none;
      color: #94a3b8;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-close:hover { background: #475569; color: #f1f5f9; }
    .modal-body { padding: 24px; }
    .modal-body h1 { font-size: 22px; font-weight: 700; margin: 24px 0 12px; color: #f1f5f9; }
    .modal-body h2 { font-size: 18px; font-weight: 600; margin: 20px 0 10px; color: #e2e8f0; border-bottom: 1px solid #334155; padding-bottom: 6px; }
    .modal-body h3 { font-size: 15px; font-weight: 600; margin: 16px 0 8px; color: #cbd5e1; }
    .modal-body p { font-size: 14px; line-height: 1.7; margin-bottom: 12px; color: #94a3b8; }
    .modal-body ul, .modal-body ol { margin: 8px 0 16px 20px; }
    .modal-body li { font-size: 14px; line-height: 1.6; color: #94a3b8; margin-bottom: 4px; }
    .modal-body code {
      background: #0f172a;
      color: #a5b4fc;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
    }
    .modal-body pre {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
      margin: 12px 0;
    }
    .modal-body pre code { background: none; padding: 0; font-size: 13px; line-height: 1.6; }
    .modal-body table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px; }
    .modal-body th {
      background: #0f172a;
      color: #94a3b8;
      text-align: left;
      padding: 8px 12px;
      font-weight: 600;
      border-bottom: 2px solid #334155;
    }
    .modal-body td { padding: 8px 12px; border-bottom: 1px solid #1e293b; color: #cbd5e1; }
    .modal-body strong { color: #e2e8f0; }
    .modal-body blockquote {
      border-left: 3px solid #6366f1;
      padding: 8px 16px;
      margin: 12px 0;
      background: rgba(99, 102, 241, 0.1);
      border-radius: 0 8px 8px 0;
    }
    .github-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #64748b;
      text-decoration: none;
      padding: 4px 12px;
      border: 1px solid #334155;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .github-link:hover { color: #f1f5f9; border-color: #6366f1; }
    .search-bar { margin-bottom: 24px; }
    .search-bar input {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px 16px;
      color: #f1f5f9;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-bar input:focus { border-color: #6366f1; }
    .search-bar input::placeholder { color: #475569; }
    .empty-state { text-align: center; padding: 48px 24px; color: #64748b; }
    @media (max-width: 640px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .report-card { flex-direction: column; }
      .header-meta { display: none; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">H</div>
      <div>
        <h1>Hub Portal <span>Relatorios</span></h1>
      </div>
    </div>
    <div class="header-meta">Atualizado em 12/03/2026</div>
  </div>
</header>

<div class="container">
  <div class="stats" id="stats"></div>

  <div class="filter-active-bar" id="filter-bar">
    <span id="filter-label"></span>
    <button onclick="clearFilter()">Limpar filtro</button>
  </div>

  <div class="search-bar">
    <input type="text" id="search" placeholder="Buscar relatorio por titulo, bug, ou palavra-chave..." autocomplete="off">
  </div>

  <div id="sections"></div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">Relatorio</h2>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
const REPO = 'lucasaugustodev/relatorios-hub';
const BRANCH = 'main';

// Categorias de cada item: 'correcao', 'analise', 'plano', 'documentacao'
const reports = [
  // Master Plan
  {
    section: 'Plano Geral',
    items: [
      {
        title: 'Plano de Correcao — 11/03/2026',

        file: 'docs/plano-correcao-bugs-11-03.md',
        icon: 'plan', emoji: '\uD83D\uDCCB',

        badges: [{ text: 'Master Plan', cls: 'info' }]
      },
      {
        title: 'Classificacao de Tarefas — 11/03',
        desc: 'Classificacao original das tarefas do backlog antes da priorizacao.',
        file: 'docs/classificacao-tarefas-11-03.md',
        icon: 'doc', emoji: '\uD83D\uDCC4',
        cat: 'plano',
        badges: [{ text: 'Referencia', cls: 'info' }]
      },
    ]
  },
  // Analises de Bugs
  {
    section: 'Analises de Bugs',
    items: [
      {
        title: 'Bug #391363 — Validacao Consolidada (E2E)',
        desc: 'Teste E2E completo via Playwright. Modal de replanejamento com gap entre valor contratado e principal. Conclusao: bug de UX, nao de calculo.',
        file: 'docs/validacao-consolidada-bug-391363.md',
        icon: 'analysis', emoji: '\uD83D\uDD0D',
        cat: 'analise',
        badges: [{ text: 'Analise', cls: 'analysis' }, { text: 'E2E testado', cls: 'confirmed' }]
      },
      {
        title: 'Bug #391363 — Validacao Inicial',
        desc: 'Primeira validacao do bug de replanejamento. Arredondamento de parcelas causava divergencia de centavos.',
        file: 'docs/validacao-bug-391363-replanejamento.md',
        icon: 'analysis', emoji: '\uD83D\uDD0D',
        cat: 'analise',
        badges: [{ text: 'Analise', cls: 'analysis' }]
      },
      {
        title: 'Bug #399923 — Analise Desconto Comissao',
        desc: 'tipoUsuario hardcoded como "comissao" faz todos receberem desconto de comissao na lojinha e adesao. Debug selector visivel em producao.',
        file: 'docs/analise-bug-399923-desconto-comissao.md',
        icon: 'analysis', emoji: '\uD83D\uDD0D',
        cat: 'analise',
        badges: [{ text: 'Analise', cls: 'analysis' }, { text: 'Critico', cls: 'critical' }]
      },
      {
        title: 'Bug #399907 — Analise Somatorio Convites Extras',
        desc: 'Desconto valor_fixo aplicado 1x no total em vez de multiplicar pela quantidade. Afeta lojinha com convites extras.',
        file: 'docs/analise-bug-399907-somatorio-convites.md',
        icon: 'analysis', emoji: '\uD83D\uDD0D',
        cat: 'analise',
        badges: [{ text: 'Analise', cls: 'analysis' }, { text: 'Critico', cls: 'critical' }]
      },
    ]
  },
  // Correcoes
  {
    section: 'Correcoes',
    items: [
      {
        title: 'Bug #391363 — Correcao Arredondamento Parcelas',
        desc: 'Fix aplicado em renegociacaoService.ts: Math.floor + ultima parcela compensatoria + validacao de integridade. 22 testes passando.',
        file: 'docs/plano-correcao-bugs-11-03.md',
        icon: 'fix', emoji: '\u2705',
        cat: 'correcao',
        badges: [{ text: 'Corrigido', cls: 'done' }, { text: 'Testado', cls: 'confirmed' }]
      },
      {
        title: 'Bug #399923 — Correcao Desconto Comissao',
        desc: 'Alteracoes detalhadas em 4 arquivos: usePlanosLojinha, Lojinha, SelecaoParcelamentoLojinha, SelecaoParcelamento. Remocao de debug selectors.',
        file: 'docs/correcao-bug-399923-desconto-comissao.md',
        icon: 'fix', emoji: '\u2705',
        cat: 'correcao',
        badges: [{ text: 'Corrigido', cls: 'done' }, { text: 'Pushado', cls: 'confirmed' }]
      },
      {
        title: 'Bug #399907 — Correcao Somatorio Convites',
        desc: 'Desconto valor_fixo agora multiplica pela quantidade. 29 testes passando. Zero regressao (default quantidade=1).',
        file: 'docs/correcao-bug-399907-somatorio-convites.md',
        icon: 'fix', emoji: '\u2705',
        cat: 'correcao',
        badges: [{ text: 'Corrigido', cls: 'done' }, { text: '29 testes', cls: 'confirmed' }]
      },
      {
        title: 'Correcao Valor Lote',
        desc: 'Correcao no calculo de valor de lotes — valor base, correcao monetaria e descontos.',
        file: 'docs/DOCUMENTACAO_CORRECAO_VALOR_LOTE.md',
        icon: 'fix', emoji: '\u2705',
        cat: 'correcao',
        badges: [{ text: 'Corrigido', cls: 'done' }]
      },
    ]
  },
  // Documentacao Financeira
  {
    section: 'Documentacao Financeira',
    items: [
      {
        title: 'Selecao de Parcelamento',
        desc: 'Documentacao completa do fluxo de calculo de parcelas, correcao monetaria, descontos e cronogramas.',
        file: 'docs/DOCUMENTACAO_FINANCEIRA_SELECAO_PARCELAMENTO.md',
        icon: 'finance', emoji: '\uD83D\uDCB0',
        cat: 'documentacao',
        badges: [{ text: 'Documentacao', cls: 'info' }]
      },
      {
        title: 'Renegociacao Financeira',
        desc: 'Fluxo completo de renegociacao — regras, calculos e modal.',
        file: 'docs/renegociação.md',
        icon: 'finance', emoji: '\uD83D\uDCB0',
        cat: 'documentacao',
        badges: [{ text: 'Documentacao', cls: 'info' }]
      },
      {
        title: 'Chargeback',
        desc: 'Fluxo de chargeback e tratamento de estornos.',
        file: 'docs/chargeback.md',
        icon: 'finance', emoji: '\uD83D\uDCB0',
        cat: 'documentacao',
        badges: [{ text: 'Documentacao', cls: 'info' }]
      },
    ]
  },
  // Integracoes & Contratos
  {
    section: 'Integracoes & Contratos',
    items: [
      {
        title: 'Configurar PDF com Variaveis',
        desc: 'Como configurar templates de contrato PDF com variaveis dinamicas.',
        file: 'docs/CONFIGURAR_PDF_COM_VARIAVEIS.md',
        icon: 'doc', emoji: '\uD83D\uDCC4',
        cat: 'documentacao',
        badges: [{ text: 'Guia', cls: 'info' }]
      },
      {
        title: 'Exemplo Integracao Contrato',
        desc: 'Exemplo pratico de integracao com o sistema de contratos.',
        file: 'docs/EXEMPLO_INTEGRACAO_CONTRATO.md',
        icon: 'doc', emoji: '\uD83D\uDCC4',
        cat: 'documentacao',
        badges: [{ text: 'Exemplo', cls: 'info' }]
      },
      {
        title: 'Exemplo Contrato com Variaveis',
        desc: 'Template de contrato demonstrando uso de variaveis.',
        file: 'docs/EXEMPLO_CONTRATO_COM_VARIAVEIS.md',
        icon: 'doc', emoji: '\uD83D\uDCC4',
        cat: 'documentacao',
        badges: [{ text: 'Exemplo', cls: 'info' }]
      },
    ]
  }
];

// State
let activeFilter = null; // null, 'all', 'analise', 'correcao', 'plano', 'pending'

function countItems() {
  let total = 0, analises = 0, correcoes = 0, planos = 0, pendentes = 0;
  reports.forEach(s => s.items.forEach(item => {
    total++;
    if (item.cat === 'analise') analises++;
    if (item.cat === 'correcao') correcoes++;
    if (item.cat === 'plano') planos++;
    if (item.badges.some(b => b.cls === 'pending')) pendentes++;
  }));
  return { total, analises, correcoes, planos, pendentes };
}

function toggleFilter(filter) {
  if (activeFilter === filter) {
    activeFilter = null;
  } else {
    activeFilter = filter;
  }
  document.getElementById('search').value = '';
  render();
}

function clearFilter() {
  activeFilter = null;
  document.getElementById('search').value = '';
  render();
}

const FILTER_LABELS = {
  correcao: 'Mostrando: Correcoes',
  analise: 'Mostrando: Analises de Bugs',
  plano: 'Mostrando: Planos',
  pending: 'Mostrando: Aguardando Aprovacao',
};

function render(searchQuery = '') {
  const sectionsEl = document.getElementById('sections');
  const q = searchQuery.toLowerCase();
  const counts = countItems();

  // Filter bar
  const filterBar = document.getElementById('filter-bar');
  if (activeFilter) {
    filterBar.classList.add('show');
    document.getElementById('filter-label').textContent = FILTER_LABELS[activeFilter] || 'Filtro ativo';
  } else {
    filterBar.classList.remove('show');
  }

  // Stats (clickable)
  const statsEl = document.getElementById('stats');
  const sc = (f, cls) => activeFilter === f ? 'stat-card active' : 'stat-card';
  statsEl.innerHTML = `
    <div class="${sc('all','blue')}" onclick="clearFilter()">
      <div class="label">Total de Relatorios</div>
      <div class="value blue">${counts.total}</div>
    </div>
    <div class="${sc('analise','purple')}" onclick="toggleFilter('analise')">
      <div class="label">Analises</div>
      <div class="value purple">${counts.analises}</div>
    </div>
    <div class="${sc('correcao','green')}" onclick="toggleFilter('correcao')">
      <div class="label">Correcoes</div>
      <div class="value green">${counts.correcoes}</div>
    </div>
    <div class="${sc('plano','blue')}" onclick="toggleFilter('plano')">
      <div class="label">Planos</div>
      <div class="value blue">${counts.planos}</div>
    </div>
    <div class="${sc('pending','yellow')}" onclick="toggleFilter('pending')">
      <div class="label">Aguardando</div>
      <div class="value yellow">${counts.pendentes}</div>
    </div>
  `;

  // Render sections
  let html = '';
  let visibleCount = 0;

  reports.forEach(section => {
    const filtered = section.items.filter(item => {
      // Category filter
      if (activeFilter) {
        if (activeFilter === 'pending') {
          if (!item.badges.some(b => b.cls === 'pending')) return false;
        } else {
          if (item.cat !== activeFilter) return false;
        }
      }
      // Text search
      if (q && !(item.title.toLowerCase().includes(q) || item.desc.toLowerCase().includes(q) || item.file.toLowerCase().includes(q))) {
        return false;
      }
      return true;
    });
    if (filtered.length === 0) return;
    visibleCount += filtered.length;

    html += `<h2 class="section-title">${section.section}</h2><div class="reports-grid">`;
    filtered.forEach(item => {
      const escapedTitle = item.title.replace(/'/g, "\\'");
      html += `
        <a class="report-card" onclick="openReport('${item.file}', '${escapedTitle}')">
          <div class="report-icon ${item.icon}">${item.emoji}</div>
          <div class="report-body">
            <h3>${item.title}</h3>
            <p>${item.desc}</p>
            <div class="report-meta">
              ${item.badges.map(b => `<span class="badge ${b.cls}">${b.text}</span>`).join('')}
              <a class="github-link" href="https://github.com/${REPO}/blob/${BRANCH}/${item.file}" target="_blank" onclick="event.stopPropagation()">
                GitHub &rarr;
              </a>
            </div>
          </div>
        </a>`;
    });
    html += '</div>';
  });

  if (!html) html = '<div class="empty-state">Nenhum relatorio encontrado.</div>';
  sectionsEl.innerHTML = html;
}

// Search
document.getElementById('search').addEventListener('input', e => {
  activeFilter = null;
  render(e.target.value);
});

// Modal
async function openReport(file, title) {
  const modal = document.getElementById('modal');
  const body = document.getElementById('modal-body');
  const titleEl = document.getElementById('modal-title');

  titleEl.textContent = title;
  body.innerHTML = '<p style="text-align:center;padding:40px;">Carregando...</p>';
  modal.classList.add('active');

  try {
    const url = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/${encodeURIComponent(file)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const md = await res.text();
    body.innerHTML = marked.parse(md);
  } catch (err) {
    body.innerHTML = `<p style="color:#f87171;">Erro ao carregar o documento. <a href="https://github.com/${REPO}/blob/${BRANCH}/${file}" target="_blank" style="color:#60a5fa;">Abrir no GitHub</a></p>`;
  }
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// Initial render
render();
</script>
</body>
</html>
